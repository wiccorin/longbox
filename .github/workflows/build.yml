name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that's still running.
concurrency:
  group: build-ipa-intel
  cancel-in-progress: true

jobs:
  build:
    # Intel Macs: GitHub's Apple-silicon runners have had long queues.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Longbox.xcodeproj \
            -scheme Longbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Longbox.app Payload/
          zip -qry Longbox.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Longbox-ipa
          path: Longbox.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest Longbox.ipa \
            --target "$GITHUB_SHA" \
            --title "Longbox (latest build)" \
            --notes "Unsigned build from $GITHUB_SHA. Install with Sideloadly or AltStore."
